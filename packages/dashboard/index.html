<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reqray</title>
    <!-- The lens mark, inline: the panel must not fire a request for a favicon. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='6.6' cy='6.6' r='4.4' fill='none' stroke='%234bb4e0' stroke-width='1.6'/><path d='M10 10l4 4' stroke='%234bb4e0' stroke-width='1.8' stroke-linecap='round'/></svg>" />
    <!--
      The one design font. It is the only external resource the panel uses,
      and every rule falls back to a system mono stack, so the panel stays
      readable offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
